name: Android

on:
  pull_request:
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "Android/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  assemble:
    name: Assemble debug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ github.run_id }}-${{ env.SOURCE_SHA }}
          path: Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

  unit-tests:
    name: JVM unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run debug JVM tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Upload JVM JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-jvm-results-${{ github.run_id }}-${{ env.SOURCE_SHA }}
          path: |
            Android/app/build/test-results/testDebugUnitTest/*.xml
            Android/app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
          retention-days: 14
  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run debug lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-${{ github.run_id }}-${{ env.SOURCE_SHA }}
          path: |
            Android/app/build/reports/lint-results-debug.*
            Android/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: warn
          retention-days: 14

  instrumentation:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 34]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run connected tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none
          script: cd Android && ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Upload API ${{ matrix.api-level }} instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumentation-api-${{ matrix.api-level }}-${{ github.run_id }}-${{ env.SOURCE_SHA }}
          path: |
            Android/app/build/outputs/androidTest-results/connected/**
            Android/app/build/reports/androidTests/connected/**
            Android/app/build/evidence/**
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Required CI gate
    if: always()
    needs: [assemble, unit-tests, lint, instrumentation]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Android gate
        env:
          ASSEMBLE_RESULT: ${{ needs.assemble.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
        run: |
          test "$ASSEMBLE_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$LINT_RESULT" = success
          test "$INSTRUMENTATION_RESULT" = success
