name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    # Cheap gate: the macOS suite only runs when something that can affect the app or tests changed.
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: diff
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # Manual runs have no base: always test.
          [ -z "$BASE" ] && { echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if git diff --name-only "origin/$BASE...HEAD" | grep -Eq '\.(swift|xcstrings|plist|entitlements|xcconfig|pbxproj|xcscheme|xctestplan|resolved)$|\.xcassets/|^scripts/xcb$|^\.github/workflows/ci\.yml$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "No Swift/app changes: skipping the test suite."
          fi
  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: mkdir -p .build && scripts/xcb test | tee .build/summary.json || true
      - name: Assert tests ran and passed
        # xcb test exits 0 on a compile failure, so check the summary, not the exit code.
        run: |
          python3 - <<'PY'
          import json, sys
          s = json.load(open(".build/summary.json"))
          total, failed = s.get("totalTestCount", 0), s.get("failedTests", 0)
          print(f"total={total} failed={failed}")
          sys.exit(0 if total > 0 and failed == 0 and s.get("result") == "Passed" else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: .build/test.log
